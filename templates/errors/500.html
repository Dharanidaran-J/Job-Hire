{% extends "base.html" %}

{% block title %}Server Error (500) | ChallengeHire{% endblock %}

{% block content %}
<section class="section" style="text-align: center; padding: 100px 0;">
    <div class="container" style="max-width: 540px;">
        <div style="font-size: 4rem; font-weight: 900; color: #f59e0b; margin-bottom: 12px;">500</div>
        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 16px;">Internal Server Error</h1>
        <p style="color: var(--text-secondary); margin-bottom: 28px; line-height: 1.6;">
            An unexpected error occurred while processing your request. Please try refreshing or return home.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">&larr; Return to Home</a>
    </div>
</section>
{% endblock %}
